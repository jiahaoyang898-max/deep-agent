services:
  db:
    image: mysql:8.0
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    container_name: mydb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: itwwy123456
      MYSQL_DATABASE: mydb
      MYSQL_USER: itwwy
      MYSQL_PASSWORD: itwwy123
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./db.sql:/docker-entrypoint-initdb.d/db.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data: