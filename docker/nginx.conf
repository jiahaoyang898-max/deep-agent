# Deep Agent Search 前端网关
server {
    listen 80;
    server_name _;
    client_max_body_size 200m;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # 静态资源长缓存（带 hash 的文件名）
    location /assets/ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 认证微服务 → auth:8001
    location /api/auth/ {
        proxy_pass http://auth:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;

        # 剥离上游（auth 服务）的 CORS 响应头，使 API 仅同源可读。
        # 本部署下前端与 API 同源（都在网关 :8080），CORS 本就不参与；
        # 上游若返回 Access-Control-Allow-Origin: *，任意站点即可跨域读取本 API 响应，
        # 故在网关层统一剔除。将来若确需跨域，再按具体白名单显式 add_header。
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Expose-Headers;
    }

    # 后端 API → backend:8000
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;   # 任务启动接口可能较慢

        # 同上：剥离后端 CORS 头，收敛为仅同源可读。
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Expose-Headers;
    }

    # WebSocket → backend:8000
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;  # 长连接保活
        proxy_send_timeout 3600s;

        # 仅隐藏响应头，不影响 WebSocket 的 Upgrade / Connection 协商。
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Expose-Headers;
    }

    # 前端 SPA
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
