name: deep-agent-search

# ============================================================
#  敏感值来源说明
#  ------------------------------------------------------------
#  所有密码都不再硬编码在本文件里，统一从**项目根目录的 .env** 读取
#  （Docker Compose 会自动加载同目录下的 .env 用于变量替换）。
#
#  首次使用：
#    cp .env.example .env
#    cp docker/.env.docker.example docker/.env.docker
#  或直接运行一键脚本 start.sh / start.ps1 / start.bat，
#  它们会在文件缺失时自动从模板生成，并随机生成一个 MySQL 密码、
#  同时写入 .env 与 docker/.env.docker（两处必须一致）。
# ============================================================

services:
  # ---------- MySQL 8.0（utf8mb4）----------
  mysql:
    image: mysql:8.0
    container_name: das-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    environment:
      # 不再硬编码密码；未设置时直接报错并给出提示（避免用默认弱口令静默启动）
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?未设置 MYSQL_PASSWORD，请先复制 .env.example 为 .env 并填写}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pharma_db}
      TZ: Asia/Shanghai
    volumes:
      - ./docker-data/mysql:/var/lib/mysql
      # 首次启动自动建库建表（sql/db.sql 内含 CREATE DATABASE / USE pharma_db）
      - ./sql/db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      # 只监听回环地址：避免同一局域网内的设备直连数据库
      - "127.0.0.1:3307:3306"
    healthcheck:
      # 用 MYSQL_PWD 环境变量传密码，避免密码出现在容器进程参数里
      # （$$ 是 Compose 的转义，传给容器内的 shell 才是 $MYSQL_ROOT_PASSWORD）
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h localhost -uroot --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------- 认证微服务（登录/注册）----------
  auth:
    build:
      context: .
      dockerfile: docker/auth.Dockerfile
    container_name: das-auth
    restart: unless-stopped
    environment:
      AUTH_DB_PATH: /data/auth.db
    volumes:
      - ./docker-data/auth:/data
    ports:
      # 只监听回环，浏览器与 Nginx 都通过 8080 网关访问
      - "127.0.0.1:8001:8001"

  # ---------- 后端（FastAPI + DeepAgent，原代码零改动）----------
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: das-backend
    restart: unless-stopped
    env_file:
      - docker/.env.docker
    volumes:
      - ./output:/app/output   # 智能体产出文件
      - ./upload:/app/upload   # 上传文件
      - ./docker/.env.docker:/app/.env:ro
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      # 只监听回环，便于本机调试直连
      - "127.0.0.1:8000:8000"

  # ---------- 前端（Nginx 托管 + 网关）----------
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        # 登录页是否展示演示账号块。默认展示；正式对外时设为 false 并重新构建：
        #   VITE_SHOW_DEMO=false docker compose up -d --build frontend
        VITE_SHOW_DEMO: ${VITE_SHOW_DEMO:-true}
    container_name: das-frontend
    restart: unless-stopped
    depends_on:
      - backend
      - auth
    ports:
      - "8080:80" # 浏览器访问 http://localhost:8080（对外唯一入口）
